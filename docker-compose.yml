version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: finance_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/finance-tracker
      - JWT_SECRET=development_secret_do_not_use_in_prod
      - GEMINI_API_KEY=your_gemini_api_key_here
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: finance_client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mongodb_data:
